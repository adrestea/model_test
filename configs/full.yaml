# 全量选型矩阵：8 个引擎 × 识别任务
# 用法：veval run -c configs/full.yaml
run:
  name: full-matrix
  dataset:
    name: invoice          # datasets/invoice/ 目录名
    lang: zh
    # limit: 50            # 冒烟测试时只跑前 50 张
  tasks: [recognize]
  concurrency: 4
  retries: 1
  repeats: 1               # 需要延迟稳定统计时设 3
  cache: true
  normalize:
    strip_whitespace: true   # 归一化：去空白
    lower: false
    unify_punct: true        # 全角/半角标点统一
    drop_punct: false        # 严谨口径下不要丢标点

engines:
  # ---------- 传统 OCR（本地 CPU） ----------
  - id: rapidocr
    type: ocr.rapidocr
    params: { device: cpu }
    cost: { per_image: 0 }

  - id: tesseract
    type: ocr.tesseract
    params:
      lang: chi_sim+eng
      psm: 6
      device: cpu
    cost: { per_image: 0 }

  - id: paddleocr
    type: ocr.paddleocr
    params:
      lang: ch
      device: cpu          # 有 GPU 时改 cuda:0
      use_angle_cls: true
    cost: { per_image: 0 }

  # ---------- 在线 VLM ----------
  - id: qwen-vl-max
    type: vlm.openai_compat
    params:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-vl-max
      api_key_env: DASHSCOPE_API_KEY
      max_tokens: 4096
    cost: { input_per_1m: 3.0, output_per_1m: 9.0 }

  - id: gpt-4o-mini
    type: vlm.openai_compat
    params:
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
      api_key_env: OPENAI_API_KEY
      max_tokens: 4096
    cost: { input_per_1m: 0.15, output_per_1m: 0.6 }

  - id: glm-4v
    type: vlm.openai_compat
    params:
      base_url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4v-plus
      api_key_env: ZHIPU_API_KEY
    cost: { input_per_1m: 4.0, output_per_1m: 4.0 }

  - id: gemini
    type: vlm.gemini
    params:
      model: gemini-2.0-flash
      api_key_env: GEMINI_API_KEY
    cost: { input_per_1m: 0.1, output_per_1m: 0.4 }

  # ---------- 本地 VLM（接口扩展，CPU/GPU 自适应） ----------
  - id: local-qwen25vl-3b
    type: vlm.local
    params:
      backend: ollama                     # ollama | openai_compat | transformers
      model: qwen2.5vl:3b
      base_url: http://localhost:11434
      device: auto                        # auto -> cuda 可用则 cuda，否则 cpu
      max_new_tokens: 2048
    cost: { per_image: 0 }
