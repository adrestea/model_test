# 文档截图场景：现在只有 2 张密集小字截图，先验证管线与口径
# 用法：.venv/bin/python cli.py run -c configs/docshot.yaml
# 有 API key 后再补云端 VLM 对比（把下面 engines 解开注释）
run:
  name: docshot
  dataset:
    name: docshot
    lang: mixed
  tasks: [recognize]
  concurrency: 2
  retries: 1
  repeats: 1
  cache: true
  normalize:
    strip_whitespace: true   # 截图是折行显示，按字符算 CER，不按行
    lower: false
    unify_punct: true        # 全角（）→（）与 OCR 读出的半角已由 NFKC 统一
    drop_punct: false        # 严谨口径：Markdown 标记符号也是图中内容，不能丢
    box_iou_threshold: 0.5

engines:
  - id: rapidocr
    type: ocr.rapidocr
    params: { device: cpu }
    cost: { per_image: 0 }

  # 第二个本地引擎：paddleocr 在本机**不可用**，实测 SIGILL
  #   i7-13700 无 avx512f，paddlepaddle 2.6.2 轮子里有 AVX512 代码路径，
  #   首次推理崩在 SelfAttentionFusePass（关 mkldnn 也救不了）；镜像无 2.5.2。
  #   注：rapidocr 本身用的就是 PaddleOCR 的 PP-OCRv4 模型（onnxruntime 推理），
  #   装 paddleocr 2.x 做对比 ≈ 同模型换运行时，信息量很低。详见 STATUS.md Q 段。
